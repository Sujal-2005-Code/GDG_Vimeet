<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Theme: set before first paint so there is no white/black flash.
         Redesigned routes are "light", everything else is still "legacy" (dark).
         Keep this list in step with LIGHT_ROUTES in src/components/RootLayout.jsx. -->
    <script>
      document.documentElement.dataset.theme = location.pathname === '/' ? 'light' : 'legacy';
    </script>

    <!-- Primary Meta -->
    <title>GDG On Campus Vishwaniketan (ViMEET) 2026-27</title>
    <meta name="title" content="GDG On Campus Vishwaniketan (ViMEET) 2026-27" />
    <meta name="description" content="GDG On Campus Vishwaniketan (ViMEET) — a student-led Google Developer Groups community. Workshops, hackathons, study jams and a place to build, learn and grow together." />
    <meta name="keywords" content="GDG, GDG On Campus, GDG ViMEET, Google Developer Groups, Vishwaniketan, ViMEET, events, community, 2026-27" />
    <meta name="author" content="GDG On Campus Vishwaniketan" />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://gdg-vimeet.vercel.app/" />

    <!-- Icons: neutral four-colour favicon (the official logo is not used until supplied) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Open Graph / Twitter. TODO: add a 1200x630 og:image once the official logo/brand art is supplied. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GDG On Campus Vishwaniketan" />
    <meta property="og:url" content="https://gdg-vimeet.vercel.app/" />
    <meta property="og:title" content="GDG On Campus Vishwaniketan (ViMEET) 2026-27" />
    <meta property="og:description" content="A student-led Google Developer Groups community — workshops, hackathons, study jams and collaboration." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="GDG On Campus Vishwaniketan (ViMEET) 2026-27" />
    <meta name="twitter:description" content="A student-led Google Developer Groups community — workshops, hackathons, study jams and collaboration." />

    <!-- Self-hosted Inter (variable): preloaded so the hero text renders in the final font. -->
    <link rel="preload" href="/fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Hero lockup (site.brand.lockup): discovered at HTML-parse time instead of after React mounts.
         Update/remove together with site.brand.lockup. -->
    <link rel="preload" href="/images/gdg-on-campus-vishwaniketan.svg" as="image" type="image/svg+xml" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
